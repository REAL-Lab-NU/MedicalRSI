<style>
.beat { stroke-dasharray: 34; animation: trace 2.6s ease-in-out infinite; }
@keyframes trace { 0% { stroke-dashoffset: 34; } 45% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -34; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 0%, 30%, 100% { transform: scale(1); } 40% { transform: scale(1.3); } 52% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .beat, .pulse { animation: none; } }
</style>
